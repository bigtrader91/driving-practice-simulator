name: Finalize Simulator Source

on:
  push:
    branches: [feature/simulator-completion]
    paths: [.github/workflows/finalize-source.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/simulator-completion
      - name: Apply final TypeScript corrections
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          source = path.read_text(encoding='utf-8')
          old_load = """function loadJson<T>(key: string, fallback: T): T {
            try { const raw = localStorage.getItem(key); return raw ? { ...fallback, ...JSON.parse(raw) } : fallback; } catch { return fallback; }
          }"""
          new_load = """function loadJson<T extends object>(key: string, fallback: T): T {
            try {
              const raw = localStorage.getItem(key);
              return raw ? Object.assign({}, fallback, JSON.parse(raw)) as T : fallback;
            } catch {
              return fallback;
            }
          }"""
          if old_load not in source:
            raise SystemExit('loadJson correction target not found')
          source = source.replace(old_load, new_load)
          old_resume = """    if (!this.ctx) {
                const AudioCtor = window.AudioContext || (window as unknown as { webkitAudioContext: typeof AudioContext }).webkitAudioContext;
                this.ctx = new AudioCtor();
              }
              void this.ctx.resume();
              if (!this.engine) {
                this.engine = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engine.type = 'sawtooth';
                this.engine.frequency.value = 38;
                this.engineGain.gain.value = 0;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 260;
                this.engine.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
                this.engine.start();
              }"""
          new_resume = """    if (!this.ctx) {
                const AudioCtor = window.AudioContext || (window as unknown as { webkitAudioContext: typeof AudioContext }).webkitAudioContext;
                this.ctx = new AudioCtor();
              }
              const ctx = this.ctx;
              void ctx.resume();
              if (!this.engine) {
                const engine = ctx.createOscillator();
                const engineGain = ctx.createGain();
                engine.type = 'sawtooth';
                engine.frequency.value = 38;
                engineGain.gain.value = 0;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 260;
                engine.connect(filter); filter.connect(engineGain); engineGain.connect(ctx.destination);
                engine.start();
                this.engine = engine;
                this.engineGain = engineGain;
              }"""
          if old_resume not in source:
            raise SystemExit('audio correction target not found')
          source = source.replace(old_resume, new_resume)
          old_safe = "else if (!collision && Math.abs(speedMs) < 12) lastSafe = { x, z, heading };"
          new_safe = "else if (!collision) lastSafe = { x, z, heading };"
          if old_safe not in source:
            raise SystemExit('collision correction target not found')
          source = source.replace(old_safe, new_safe)
          path.write_text(source, encoding='utf-8')
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build corrected source
        run: npm run check
      - name: Commit verified corrections and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/finalize-source.yml
          git commit -m "fix: harden persisted settings audio initialization and collision rollback"
          git push origin HEAD:feature/simulator-completion
